<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsTrader Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .news-item { 
            border: 1px solid #ddd; 
            margin: 10px 0; 
            padding: 15px; 
            border-radius: 5px; 
        }
        .impact { 
            background: #f0f0f0; 
            padding: 5px 10px; 
            border-radius: 3px; 
            margin: 5px 0; 
        }
        .symbols { 
            color: #0066cc; 
            font-weight: bold; 
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { background: #0056b3; }
        .status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>NewsTrader - AI Trading Analytics</h1>
        
        <div id="status" class="status"></div>
        
        <div>
            <button onclick="testAPI()">Test API Connection</button>
            <button onclick="loadNews()">Load News</button>
            <button onclick="loadAnalysis()">Load Analysis</button>
        </div>

        <div id="content"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = isError ? 'status error' : 'status success';
        }

        async function testAPI() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                showStatus(`API Status: ${data.status}`);
            } catch (error) {
                showStatus(`API Error: ${error.message}`, true);
            }
        }

        async function loadNews() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/news/articles`);
                const articles = await response.json();
                
                let html = '<h2>Latest News</h2>';
                articles.forEach(article => {
                    html += `
                        <div class="news-item">
                            <h3>${article.title}</h3>
                            <p>${article.summary}</p>
                            <div class="impact">
                                Impact Score: ${article.impact_score}/10 | 
                                Sentiment: ${article.sentiment_score > 0 ? 'Positive' : article.sentiment_score < 0 ? 'Negative' : 'Neutral'} |
                                Confidence: ${(article.confidence_score * 100).toFixed(0)}%
                            </div>
                            <div class="symbols">Symbols: ${article.affected_symbols.join(', ')}</div>
                            <small>Source: ${article.source} | ${new Date(article.published_at).toLocaleString()}</small>
                        </div>
                    `;
                });
                
                document.getElementById('content').innerHTML = html;
                showStatus(`Loaded ${articles.length} news articles`);
            } catch (error) {
                showStatus(`Failed to load news: ${error.message}`, true);
            }
        }

        async function loadAnalysis() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/analysis/impact-summary`);
                const data = await response.json();
                
                let html = '<h2>Market Impact Analysis</h2>';
                html += `<p>Total articles analyzed in last ${data.time_period_hours} hours: ${data.total_articles}</p>`;
                
                data.summary.forEach(item => {
                    html += `
                        <div class="news-item">
                            <h3>${item.symbol}</h3>
                            <div class="impact">
                                Articles: ${item.article_count} | 
                                Avg Impact: ${item.avg_impact.toFixed(1)}/10 |
                                Sentiment: ${item.avg_sentiment > 0 ? '+' : ''}${item.avg_sentiment.toFixed(2)} |
                                Confidence: ${(item.avg_confidence * 100).toFixed(0)}%
                            </div>
                            <small>Last article: ${new Date(item.latest_article).toLocaleString()}</small>
                        </div>
                    `;
                });
                
                document.getElementById('content').innerHTML = html;
                showStatus(`Loaded analysis for ${data.summary.length} symbols`);
            } catch (error) {
                showStatus(`Failed to load analysis: ${error.message}`, true);
            }
        }

        // Test API on page load
        testAPI();
    </script>
</body>
</html>
